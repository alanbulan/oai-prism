# ============================================================
# OAIprism CI 流水线
#
# 两个并行 job：
#   go-check   Go 门禁（vet → test → race → 构建产物）
#   web-check  Dashboard 门禁（回归测试 → tsc 类型检查 → vite 构建）
#
# 本地等价命令（提交前必须全绿，见 README「开发与校验」）：
#   go vet ./... && go test ./... && go test -race ./...
#   cd web && pnpm test && npx tsc --noEmit && pnpm build
#
# 说明：race 检测不是可选项 —— 本项目有账号池/粘性表/SSE 写出/热重载
# 等大量并发结构，历史上靠并发测试抓到过越界 panic。
# ============================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-check:
    name: Go 门禁（vet / test / race / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test ./...

      - name: 并发竞态测试
        run: go test -race ./...

      - name: 构建（本机架构）
        run: go build -trimpath -o bin/oaiprism ./cmd/oaiprism

      - name: 交叉编译（Linux 部署产物）
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/oaiprism-linux-amd64 ./cmd/oaiprism
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o bin/oaiprism-linux-arm64 ./cmd/oaiprism

      - name: 上传二进制（可选产物）
        uses: actions/upload-artifact@v4
        with:
          name: oaiprism-linux
          path: bin/oaiprism-linux-*
          retention-days: 7

  web-check:
    name: Dashboard 门禁（test / tsc / vite build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 回归测试
        run: pnpm test

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建产物
        run: pnpm build
