<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <title>OAIprism</title>
  <defs>
    <linearGradient id="op-bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b2f7a"/>
      <stop offset="1" stop-color="#0c0e24"/>
    </linearGradient>
    <radialGradient id="op-glow" cx="64" cy="62" r="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b8cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="op-glass" x1="64" y1="22" x2="64" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <clipPath id="op-clip">
      <rect width="128" height="128" rx="28"/>
    </clipPath>
  </defs>
  <g clip-path="url(#op-clip)">
    <rect width="128" height="128" fill="url(#op-bg)"/>
    <rect width="128" height="128" fill="url(#op-glow)"/>
    <!-- 入射光：一条上游协议 -->
    <path d="M-6 79.5 46 58" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <!-- 棱镜玻璃体 -->
    <path d="M64 22 100 94H28Z" fill="url(#op-glass)"/>
    <path d="M46 58 84 62" stroke="#ffffff" stroke-opacity=".75" stroke-width="3" stroke-linecap="round"/>
    <!-- 出射光谱：多种标准接口 -->
    <path d="M84 62 136 63 136 71Z" fill="#ff5f6d"/>
    <path d="M84 62 136 71 136 79Z" fill="#ffa53d"/>
    <path d="M84 62 136 79 136 87Z" fill="#ffe04d"/>
    <path d="M84 62 136 87 136 95Z" fill="#3ddc97"/>
    <path d="M84 62 136 95 136 103Z" fill="#35c4ff"/>
    <path d="M84 62 136 103 136 111Z" fill="#8f7dff"/>
    <!-- 棱镜轮廓 -->
    <path d="M64 22 100 94H28Z" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round"/>
  </g>
</svg>
